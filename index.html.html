<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Camera or Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one centred column. Each prompt sits in a dark film-strip frame; two big answer cards (blue Camera = now, amber Calendar = routine) sit below it. Results and the teacher view use plain bars and one 2x2 table. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --surface-2:#e8ecf5; --ink:#121a2b; --muted:#566178; --line:#d6dce9;
  --cam:#2358e6; --cam-ink:#1d48c4; --cam-soft:#dce6ff; --on-cam:#ffffff;
  --cal:#d97706; --cal-ink:#8f4b00; --cal-soft:#fcebc9; --on-cal:#1b1200;
  --ok:#157a3d; --ok-soft:#d8f1e1; --bad:#c0281f; --bad-soft:#fbe0dd;
  --film:#0e1428; --film-ink:#f4f6fb; --film-hole:#2c3659; --film-mark:#ffd166;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1221; --surface:#161d33; --surface-2:#1f2847; --ink:#eef1f9; --muted:#9ba7c0; --line:#2b3558;
    --cam:#7aa6ff; --cam-ink:#7aa6ff; --cam-soft:#1b2d5e; --on-cam:#08122b;
    --cal:#f5a524; --cal-ink:#f5a524; --cal-soft:#46320f; --on-cal:#1b1200;
    --ok:#4fd584; --ok-soft:#12361f; --bad:#ff8077; --bad-soft:#431a17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1221; --surface:#161d33; --surface-2:#1f2847; --ink:#eef1f9; --muted:#9ba7c0; --line:#2b3558;
  --cam:#7aa6ff; --cam-ink:#7aa6ff; --cam-soft:#1b2d5e; --on-cam:#08122b;
  --cal:#f5a524; --cal-ink:#f5a524; --cal-soft:#46320f; --on-cal:#1b1200;
  --ok:#4fd584; --ok-soft:#12361f; --bad:#ff8077; --bad-soft:#431a17;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-block:14px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:680px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--cam);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.dots{display:inline-flex}
.dots i{width:16px;height:16px;border-radius:50%;display:block}
.dots .d1{background:var(--cam)}
.dots .d2{background:var(--cal);margin-left:-6px;box-shadow:0 0 0 2px var(--bg)}
.tabs{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 20px;font-weight:700;min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{min-height:38px;padding:7px 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.hero-title{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.hero-title .c1{color:var(--cam-ink)}
.hero-title .c2{color:var(--cal-ink)}
.lede{font-size:18px;max-width:46ch}
.h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.h3{font-family:var(--f-display);font-weight:700;font-size:18px}

/* concept cards */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.concept{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.concept.cam{background:var(--cam-soft);border:1px solid var(--cam)}
.concept.cal{background:var(--cal-soft);border:1px solid var(--cal)}
.concept svg{width:36px;height:36px}
.concept.cam svg,.concept.cam .name{color:var(--cam-ink)}
.concept.cal svg,.concept.cal .name{color:var(--cal-ink)}
.concept .name{font-family:var(--f-display);font-weight:800;font-size:20px}
.concept .ex{font-weight:700}

/* name field */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600}
.field input{font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-height:48px;width:100%}

/* play */
.stats{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-family:var(--f-mono);font-size:13px}
.prog{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.prog span{height:6px;border-radius:3px;background:var(--line)}
.prog .ok{background:var(--ok)}
.prog .bad{background:var(--bad)}
.prog .now{background:var(--ink)}
.prompt{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,34px);letter-spacing:-.015em;line-height:1.1}
.frame{position:relative;background:var(--film);color:var(--film-ink);border:1px solid var(--line);border-radius:12px;padding:26px 46px;min-height:120px;display:flex;align-items:center}
.frame::before,.frame::after{content:"";position:absolute;top:8px;bottom:8px;width:14px;
  background:repeating-linear-gradient(to bottom,transparent 0 6px,var(--film-hole) 6px 18px,transparent 18px 26px);border-radius:3px}
.frame::before{left:14px}
.frame::after{right:14px}
.sentence{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.sentence mark{background:transparent;color:var(--film-mark);border-bottom:3px solid var(--film-mark);padding-bottom:1px}
.sentence .blank{display:inline-block;min-width:3.2ch;border-bottom:3px dashed var(--film-ink);text-align:center;color:transparent}
.sentence .blank.filled{color:var(--film-mark);border-bottom-style:solid}
.ask{display:flex;flex-direction:column;gap:4px}
.ask .q{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.25}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{position:relative;border:0;border-radius:14px;padding:16px 10px;min-height:136px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;transition:transform .12s ease}
.choice:not([disabled]):active{transform:scale(.97)}
.choice svg{width:46px;height:46px}
.choice .lbl{font-family:var(--f-display);font-weight:800;font-size:22px}
.choice .sub{font-size:13px;font-weight:600;opacity:.9}
.choice.cam{background:var(--cam);color:var(--on-cam)}
.choice.cal{background:var(--cal);color:var(--on-cal)}
.choice.neutral{background:var(--surface);border:2px solid var(--line);color:var(--ink);min-height:84px}
.choice.neutral .lbl{font-size:24px}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.4}
.choice.is-correct{box-shadow:0 0 0 4px var(--ok)}
.choice.is-wrong{box-shadow:0 0 0 4px var(--bad)}
.choice.is-correct::after,.choice.is-wrong::after{position:absolute;top:8px;right:10px;font-weight:800;font-size:18px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff}
.choice.is-correct::after{content:"\2713";background:var(--ok)}
.choice.is-wrong::after{content:"\2715";background:var(--bad)}
.feedback{border-radius:14px;padding:14px 16px;border:2px solid;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb-head{font-family:var(--f-display);font-weight:800;font-size:20px}
.feedback.ok .fb-head{color:var(--ok)}
.feedback.bad .fb-head{color:var(--bad)}

/* exit ticket */
.rate{display:flex;flex-direction:column;gap:8px}
.rate legend{font-weight:700;padding:0}
fieldset{border:0;padding:0;margin:0;min-width:0}
.rate .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:600;min-height:48px}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* results */
.rank{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,42px);letter-spacing:-.02em;line-height:1.05}
.bigscore{font-family:var(--f-mono);font-size:15px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.fr{border-radius:8px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;border:2px solid}
.fr b{font-family:var(--f-mono);font-size:12px;font-weight:500;opacity:.8}
.fr .t{font-weight:800;font-size:18px;line-height:1.1}
.fr small{font-family:var(--f-mono);font-size:11px}
.fr.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fr.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px}
.bar-top small{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--ink)}
.fill.now{background:var(--cam)}
.fill.routine{background:var(--cal)}
.fill.good{background:var(--ok)}
.fill.low{background:var(--bad)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.matrix td,.matrix th{text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.cellv{font-family:var(--f-display);font-weight:800;font-size:24px}
.cellv.good{color:var(--ok)}
.cellv.warn{color:var(--bad)}
.cellv.zero{color:var(--muted);font-weight:500}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ul.fix{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.fix li{border-left:4px solid var(--bad);padding:2px 0 2px 12px}
.verdict{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.verdict:last-child{border-bottom:0}

/* teacher */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1}
.badge{display:inline-block;border:1px solid var(--cal);background:var(--cal-soft);color:var(--cal-ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.irow{display:flex;flex-direction:column;gap:5px;padding:8px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow .top2{display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.irow .txt{min-width:0;overflow-wrap:anywhere;font-size:15px}
.irow .pc{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
ol.items{list-style:none;margin:0;padding:0}
details.card summary{cursor:pointer;font-weight:700;font-family:var(--f-display);font-size:18px}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.guide .concept ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
textarea.csv{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:8px}
.msg{font-size:14px;color:var(--ok);font-weight:600}
@media (max-width:420px){
  .frame{padding:22px 38px}
  .frame::before{left:10px}
  .frame::after{right:10px}
}
@media (prefers-reduced-motion:reduce){.choice{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dots" aria-hidden="true"><i class="d1"></i><i class="d2"></i></span>Camera or Calendar</div>
    <nav class="tabs" aria-label="Views">
      <button type="button" id="tab-play" data-act="tab" data-tab="play" aria-selected="true">Play</button>
      <button type="button" id="tab-teacher" data-act="tab" data-tab="teacher" aria-selected="false">Teacher</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<script>
(function(){
'use strict';

/* ---------- icons ---------- */
var ICON_CAM='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 16a4 4 0 0 1 4-4h5l2.5-4h13L33 12h5a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="26" r="8" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="26" r="3" fill="currentColor"/></svg>';
var ICON_CAL='<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="10" width="34" height="31" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M7 20h34" stroke="currentColor" stroke-width="3"/><path d="M16 6v8M32 6v8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><g fill="currentColor"><circle cx="16" cy="27" r="2"/><circle cx="24" cy="27" r="2"/><circle cx="32" cy="27" r="2"/><circle cx="16" cy="34" r="2"/><circle cx="24" cy="34" r="2"/></g></svg>';

/* ---------- content ---------- */
var LEVELS={
  sort:{label:'Level 1 · Sort it',prompt:'Camera or Calendar?'},
  ccq:{label:'Level 2 · Ask the detective',prompt:'Answer the detective.'},
  form:{label:'Level 3 · Fill the gap',prompt:'Pick the right verb.'}
};
var SKILL_NAME={sort:'Sort it',ccq:'Detective questions',form:'Fill the gap'};
var ITEMS=[
 {id:1,skill:'sort',concept:'routine',text:'Mina brushes her teeth <mark>every morning</mark>.',why:'"Every morning" means again and again. Calendar! Look at the verb: she brush<b>es</b>.'},
 {id:2,skill:'sort',concept:'now',text:'<mark>Look!</mark> The dog is jumping.',why:'"Look!" means you can see it now. Camera! The verb is <b>is + -ing</b>.'},
 {id:3,skill:'sort',concept:'routine',text:'My dad <mark>works</mark> in a bank.',why:'This is his job, not one moment. Calendar! There is no -ing.'},
 {id:4,skill:'sort',concept:'now',text:'They are playing football <mark>now</mark>.',why:'"Now" is a photo of this moment. Camera! The verb is <b>are + -ing</b>.'},
 {id:5,skill:'ccq',concept:'now',text:'Tom <mark>is eating</mark> lunch.',q:'Is Tom eating at this moment?',answer:'yes',why:'<b>is eating</b> is Camera. Yes, you can take a photo of it now.'},
 {id:6,skill:'ccq',concept:'routine',text:'Tom <mark>eats</mark> lunch at 12.',q:'Does Tom do this again and again?',answer:'yes',why:'<b>eats</b> with a time is Calendar. It is his routine.'},
 {id:7,skill:'ccq',concept:'now',text:'The baby <mark>is crying</mark>.',q:'Is this a daily habit?',answer:'no',why:'<b>is crying</b> is Camera. It is happening now, not every day.'},
 {id:8,skill:'ccq',concept:'routine',text:'Sam <mark>plays</mark> tennis on Sundays.',q:'Is it true only for today?',answer:'no',why:'<b>plays</b> with "on Sundays" is Calendar. It happens every Sunday, not only today.'},
 {id:9,skill:'form',concept:'now',before:'<mark>Look!</mark> Mina',after:'a picture.',opts:[['paints','routine'],['is painting','now']],why:'"Look!" is Camera, so use <b>is painting</b>.'},
 {id:10,skill:'form',concept:'routine',before:'<mark>Every day</mark>, Ali',after:'to school.',opts:[['walks','routine'],['is walking','now']],why:'"Every day" is Calendar, so use <b>walks</b>.'},
 {id:11,skill:'form',concept:'now',before:'My sister',after:'<mark>right now</mark>.',opts:[['sings','routine'],['is singing','now']],why:'"Right now" is Camera, so use <b>is singing</b>.'},
 {id:12,skill:'form',concept:'routine',before:'Hana <mark>usually</mark>',after:'pizza on Fridays.',opts:[['eats','routine'],['is eating','now']],why:'"Usually" is Calendar, so use <b>eats</b>.'}
];
var byId={}; ITEMS.forEach(function(it){byId[it.id]=it;});
var CONCEPT_NAME={now:'Camera',routine:'Calendar'};
var CONF_LABEL=['','Not yet','A little','Yes!'];

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function strip(s){return String(s).replace(/<[^>]+>/g,'');}
function pct(c,t){return t?Math.round(100*c/t):0;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function points(ok,ms){return ok?100+Math.max(0,Math.round((8000-ms)/160)):0;}
function levelOf(acc){return acc<0.5?1:(acc<0.84?2:3);}
function secs(ms){return (ms/1000).toFixed(1);}
function label(it){
  if(it.skill==='form') return strip(it.before)+' ___ '+strip(it.after);
  if(it.skill==='ccq') return strip(it.text)+' → '+it.q;
  return strip(it.text);
}
function correctText(it){
  if(it.skill==='sort') return it.concept==='now'?'Camera':'Calendar';
  if(it.skill==='ccq') return it.answer==='yes'?'Yes':'No';
  return it.opts.filter(function(o){return o[1]===it.concept;})[0][0];
}
function fullText(it){
  if(it.skill==='form') return strip(it.before)+' '+correctText(it)+' '+strip(it.after);
  if(it.skill==='ccq') return strip(it.text)+' — '+it.q+' '+correctText(it)+'.';
  return strip(it.text)+' → '+correctText(it);
}

/* ---------- storage (best effort) ---------- */
var LS_KEY='camera-or-calendar-plays-v1';
var storageOK=true;
function loadPlays(){try{var r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):[];}catch(e){storageOK=false;return [];}}
function savePlays(){try{localStorage.setItem(LS_KEY,JSON.stringify(plays));}catch(e){storageOK=false;}}
var plays=loadPlays();
if(!Array.isArray(plays)) plays=[];

/* ---------- analysis ---------- */
function stats(list){
  function z(){return {c:0,t:0};}
  var r={n:list.length,items:{},concept:{now:z(),routine:z()},skill:{sort:z(),ccq:z(),form:z()},
    conf:{now:{now:0,routine:0},routine:{now:0,routine:0}},correct:0,total:0,ms:0,wrong:0,fastWrong:0,score:0,
    calib:{over:0,under:0,match:0},overStudents:0};
  ITEMS.forEach(function(it){r.items[it.id]={c:0,t:0,ms:0};});
  list.forEach(function(p){
    r.score+=p.score||0;
    var pc={now:z(),routine:z()};
    (p.answers||[]).forEach(function(a){
      var it=byId[a.id]; if(!it) return;
      var ok=a.ok?1:0;
      r.total++; r.ms+=a.ms; r.correct+=ok;
      var x=r.items[it.id]; x.t++; x.c+=ok; x.ms+=a.ms;
      r.concept[it.concept].t++; r.concept[it.concept].c+=ok;
      pc[it.concept].t++; pc[it.concept].c+=ok;
      r.skill[it.skill].t++; r.skill[it.skill].c+=ok;
      if(a.cc) r.conf[it.concept][a.cc]++;
      if(!ok){r.wrong++; if(a.ms<3000) r.fastWrong++;}
    });
    if(p.conf){
      var over=false;
      ['now','routine'].forEach(function(k){
        var acc=pc[k].t?pc[k].c/pc[k].t:0;
        var g=(p.conf[k]||0)-levelOf(acc);
        if(g>0){r.calib.over++;over=true;} else if(g<0){r.calib.under++;} else {r.calib.match++;}
      });
      if(over) r.overStudents++;
    }
  });
  return r;
}
function bar(name,c,t,kind){
  var p=pct(c,t);
  return '<div><div class="bar-top"><span>'+name+'</span><span class="mono">'+(t?p+'%':'–')+' <small>'+c+'/'+t+'</small></span></div><div class="track"><div class="fill '+kind+'" style="width:'+p+'%"></div></div></div>';
}
function matrix(st){
  var m=st.conf;
  function cell(v,good){return '<td><span class="cellv '+(v===0?'zero':(good?'good':'warn'))+'">'+v+'</span></td>';}
  return '<div class="tbl"><table class="matrix"><thead><tr><th></th><th>Picked Camera</th><th>Picked Calendar</th></tr></thead><tbody>'+
    '<tr><td><b>Real Camera</b></td>'+cell(m.now.now,true)+cell(m.now.routine,false)+'</tr>'+
    '<tr><td><b>Real Calendar</b></td>'+cell(m.routine.now,false)+cell(m.routine.routine,true)+'</tr></tbody></table></div>';
}
function insightsFor(p){
  var st=stats([p]),out=[];
  var cN=st.concept.now,cR=st.concept.routine;
  if(st.correct===st.total){
    out.push('Perfect round. You read the clue words and the verbs correctly.');
    out.push('Your average time was '+secs(st.ms/st.total)+' seconds per answer.');
    return out;
  }
  var pn=pct(cN.c,cN.t),pr=pct(cR.c,cR.t);
  if(pn!==pr) out.push((pn<pr?'Camera':'Calendar')+' sentences were harder for you ('+Math.min(pn,pr)+'% right, against '+Math.max(pn,pr)+'%).');
  else out.push('Camera and Calendar sentences were equally hard for you.');
  var a=st.conf.now.routine,b=st.conf.routine.now;
  if(a) out.push('You called '+a+' Camera sentence'+(a>1?'s':'')+' a Calendar sentence. Look for: now, right now, Look!, at the moment.');
  if(b) out.push('You called '+b+' Calendar sentence'+(b>1?'s':'')+' a Camera sentence. Look for: every day, usually, on Sundays.');
  if(st.fastWrong) out.push(st.fastWrong+' wrong answer'+(st.fastWrong>1?'s':'')+' came in under 3 seconds. Slow down and find the clue word first.');
  return out.slice(0,3);
}
function classInsights(st){
  var out=[];
  var ranked=ITEMS.map(function(it){var x=st.items[it.id];return {it:it,t:x.t,r:pct(x.c,x.t)};}).filter(function(x){return x.t>0;})
    .sort(function(a,b){return a.r-b.r||a.it.id-b.it.id;});
  if(ranked.length){
    var h=ranked[0];
    out.push('Hardest item: "'+esc(label(h.it))+'" ('+h.r+'% right). Reteach tip: '+esc(strip(h.it.why)));
  }
  var pn=pct(st.concept.now.c,st.concept.now.t),pr=pct(st.concept.routine.c,st.concept.routine.t);
  if(pn!==pr) out.push((pn<pr?'Camera (present continuous)':'Calendar (simple present)')+' was weaker: '+Math.min(pn,pr)+'% right, against '+Math.max(pn,pr)+'%.');
  var a=st.conf.now.routine,b=st.conf.routine.now;
  if(a||b){
    out.push(a>=b
      ? a+' times a Camera sentence was called Calendar (against '+b+' the other way). Practise the clue words: now, right now, Look!, at the moment.'
      : b+' times a Calendar sentence was called Camera (against '+a+' the other way). Practise the clue words: every day, usually, on Sundays.');
  }
  if(st.wrong){
    var fw=pct(st.fastWrong,st.wrong);
    if(fw>=40) out.push(fw+'% of wrong answers came in under 3 seconds. Many students guessed. Ask them to point at the clue word before they answer.');
  }
  if(st.n && st.calib.over+st.calib.under+st.calib.match){
    out.push(st.overStudents+' of '+st.n+' students felt more sure than their score on at least one tense.');
  }
  return out;
}

/* ---------- state ---------- */
var S={tab:'play',screen:'start',name:'',order:[],idx:0,answers:[],answered:null,optOrder:[0,1],t0:0,streak:0,score:0,
  conf:{now:0,routine:0},last:null,clearArm:false,csv:'',msg:'',guideOpen:false};
var view=document.getElementById('view');

function cur(){return byId[S.order[S.idx]];}
function startGame(){
  var ids=function(sk){return shuffle(ITEMS.filter(function(i){return i.skill===sk;}).map(function(i){return i.id;}));};
  S.order=ids('sort').concat(ids('ccq'),ids('form'));
  S.idx=0;S.answers=[];S.answered=null;S.streak=0;S.score=0;S.conf={now:0,routine:0};S.last=null;
  S.optOrder=Math.random()<.5?[0,1]:[1,0];
  S.screen='play';
}
function correctKey(it){
  if(it.skill==='sort') return it.concept==='now'?'camera':'calendar';
  if(it.skill==='ccq') return it.answer;
  return String(S.optOrder.findIndex(function(oi){return it.opts[oi][1]===it.concept;}));
}
function answer(key){
  if(S.answered) return;
  var it=cur(),ms=Math.max(200,performance.now()-S.t0);
  var ok=key===correctKey(it),cc=null;
  if(it.skill==='sort') cc=key==='camera'?'now':'routine';
  if(it.skill==='form') cc=it.opts[S.optOrder[+key]][1];
  var pts=points(ok,ms);
  S.streak=ok?S.streak+1:0; S.score+=pts;
  S.answers.push({id:it.id,ok:ok,ms:Math.round(ms),cc:cc});
  S.answered={key:key,ok:ok,pts:pts};
}
function next(){
  S.idx++; S.answered=null;
  S.optOrder=Math.random()<.5?[0,1]:[1,0];
  S.screen=S.idx>=ITEMS.length?'ticket':'play';
}
function finish(){
  var nm=(S.name||'').trim()||('Player '+(plays.filter(function(p){return !p.demo;}).length+1));
  var p={name:nm,ts:Date.now(),demo:false,answers:S.answers.slice(),score:S.score,conf:{now:S.conf.now,routine:S.conf.routine}};
  plays.push(p); savePlays(); S.last=p; S.screen='result';
}

/* demo class */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeDemo(){
  var rnd=mulberry(20261108);
  var pw={1:.06,2:.08,3:.34,4:.07,5:.1,6:.18,7:.42,8:.46,9:.14,10:.18,11:.16,12:.3};
  var list=[];
  for(var i=1;i<=24;i++){
    var answers=[],score=0;
    ITEMS.forEach(function(it){
      var wrong=rnd()<pw[it.id]*(0.75+rnd()*0.5);
      var ok=!wrong;
      var ms=Math.round(wrong?(1200+rnd()*3400):(1800+rnd()*5200));
      var cc=null;
      if(it.skill!=='ccq') cc=ok?it.concept:(it.concept==='now'?'routine':'now');
      score+=points(ok,ms);
      answers.push({id:it.id,ok:ok,ms:ms,cc:cc});
    });
    var r1=rnd(),r2=rnd();
    list.push({name:'Example '+(i<10?'0':'')+i,ts:Date.now()-i*60000,demo:true,answers:answers,score:score,
      conf:{now:r1<.12?1:(r1<.55?2:3),routine:r2<.08?1:(r2<.35?2:3)}});
  }
  return list;
}
function buildCSV(){
  function c(s){return '"'+String(s).replace(/"/g,'""')+'"';}
  var rows=[['name','example_data','item','level','type','correct','seconds'].join(',')];
  plays.forEach(function(p){
    p.answers.forEach(function(a){
      var it=byId[a.id]; if(!it) return;
      rows.push([c(p.name),p.demo?'yes':'no',a.id,SKILL_NAME[it.skill],CONCEPT_NAME[it.concept],a.ok?1:0,secs(a.ms)].join(','));
    });
  });
  return rows.join('\n');
}

  if(S.tab==='teacher'){view.innerHTML=viewTeacher();}
  else if(S.screen==='start'){view.innerHTML=viewStart();}
  else if(S.screen==='play'){view.innerHTML=viewPlay();if(!S.answered) S.t0=performance.now();}
  else if(S.screen==='ticket'){view.innerHTML=viewTicket();}
  else {view.innerHTML=viewResult();}
  var nb=document.getElementById('nextBtn'); if(nb) nb.focus({preventScroll:false});
  var cb=document.getElementById('csvBox'); if(cb){cb.focus();cb.select();}
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  var act=b.getAttribute('data-act');
  if(act!=='clear') S.clearArm=false;
  if(act==='tab'){S.tab=b.getAttribute('data-tab');S.msg='';S.csv='';}
  else if(act==='start'){var inp=document.getElementById('playerName');S.name=inp?inp.value:S.name;startGame();}
  else if(act==='ans'){answer(b.getAttribute('data-key'));}
  else if(act==='next'){next();}
  else if(act==='conf'){S.conf[b.getAttribute('data-k')]=+b.getAttribute('data-v');}
  else if(act==='finish'){finish();}
  else if(act==='again'){S.name='';S.screen='start';}
  else if(act==='demo'){plays=plays.filter(function(p){return !p.demo;}).concat(makeDemo());savePlays();S.msg='Example class loaded. It is marked as example data.';S.csv='';}
  else if(act==='clear'){
    if(S.clearArm){plays=[];savePlays();S.clearArm=false;S.msg='All saved results deleted.';S.csv='';}
    else S.clearArm=true;
  }
  else if(act==='csv'){
    var text=buildCSV();S.csv='';S.msg='';
    var done=false;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){S.msg='CSV copied.';render();},function(){S.csv=text;S.msg='Select and copy the text below.';render();});
        done=true;
      }
    }catch(err){done=false;}
    if(!done){S.csv=text;S.msg='Select and copy the text below.';}
  }
  render();
  if(act==='tab'||act==='start'||act==='again'){window.scrollTo(0,0);}
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='playerName') S.name=e.target.value;});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='playerName'){e.preventDefault();S.name=e.target.value;startGame();render();window.scrollTo(0,0);}
});
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='guide') S.guideOpen=e.target.open;},true);

render();
})();
</script>

</body></html>
